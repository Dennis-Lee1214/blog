<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Arial, sans-serif">
<rect width="960" height="490" rx="16" fill="#f5f6f8"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="40" y="50" font-size="22" font-weight="700" fill="#1f2328">OAuth 登录流程</text><rect x="40" y="75" width="160" height="40" rx="8" fill="#fff" stroke="#aab"/><text x="120" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">终端</text><line x1="120" y1="115" x2="120" y2="440" stroke="#ccd" stroke-dasharray="4 4"/><rect x="280" y="75" width="160" height="40" rx="8" fill="#fff" stroke="#aab"/><text x="360" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">浏览器</text><line x1="360" y1="115" x2="360" y2="440" stroke="#ccd" stroke-dasharray="4 4"/><rect x="520" y="75" width="160" height="40" rx="8" fill="#fff" stroke="#aab"/><text x="600" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Oura 云端</text><line x1="600" y1="115" x2="600" y2="440" stroke="#ccd" stroke-dasharray="4 4"/><rect x="760" y="75" width="160" height="40" rx="8" fill="#fff" stroke="#aab"/><text x="840" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">本地 8080 端口</text><line x1="840" y1="115" x2="840" y2="440" stroke="#ccd" stroke-dasharray="4 4"/><line x1="124" y1="150" x2="354" y2="150" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="240.0" y="142" text-anchor="middle" font-size="13" fill="#333">① 打开授权页面</text><line x1="364" y1="198" x2="594" y2="198" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="480.0" y="190" text-anchor="middle" font-size="13" fill="#333">② 登录 Oura，点同意</text><line x1="604" y1="246" x2="834" y2="246" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="720.0" y="238" text-anchor="middle" font-size="13" fill="#333">③ 跳回 localhost:8080/callback?code=…</text><line x1="836" y1="294" x2="126" y2="294" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="480.0" y="286" text-anchor="middle" font-size="13" fill="#333">④ 脚本拿到 code</text><line x1="124" y1="342" x2="594" y2="342" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="360.0" y="334" text-anchor="middle" font-size="13" fill="#333">⑤ 用 code + Secret 换 token</text><line x1="596" y1="390" x2="126" y2="390" stroke="#8a8f98" stroke-width="2" marker-end="url(#ah)"/><text x="360.0" y="382" text-anchor="middle" font-size="13" fill="#333">⑥ 返回 access / refresh token</text><text x="120" y="465" text-anchor="middle" font-size="13" fill="#1a7f37">⑦ 存到 ~/.oura_tokens.json</text>
</svg>