<text x="66" y="138" font-size="14" font-family="Menlo, 'SF Mono', Consolas, monospace" xml:space="preserve"><tspan fill="#6a9955">~ % </tspan><tspan fill="#e8e8e8">curl -LsSf https://astral.sh/uv/install.sh | sh</tspan></text>
